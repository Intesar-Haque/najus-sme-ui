<header class="navbar" [class.navbar--scrolled]="scrolled()">
  <div class="navbar__inner container">

    <!-- Logo -->
    <a class="navbar__brand" routerLink="/">
      <img src="/assets/logo.png" alt="NAJUS MSME" class="navbar__logo" />
    </a>

    <!-- Desktop Nav Links -->
    <nav class="navbar__links hide-mobile">
      @for (link of navLinks; track link.path) {
        <a class="nav-link"
           [routerLink]="link.path"
           routerLinkActive="nav-link--active">
          {{ link.label | translate }}
        </a>
      }
    </nav>

    <!-- Actions -->
    <div class="navbar__actions">

      <!-- Search -->
      <form class="navbar-search hide-mobile" (ngSubmit)="search(searchBox.value)">
        <button type="submit" class="navbar-search__icon" aria-label="Search">
          <span nz-icon nzType="search"></span>
        </button>
        <input #searchBox type="text" class="navbar-search__input" placeholder="Search products…" />
      </form>

      <!-- Mobile search toggle — the desktop search box above is hidden at
           this width (.hide-mobile), so this is the only way to reach
           search without first opening the full hamburger menu. -->
      <button type="button" class="icon-btn hide-desktop" aria-label="Search"
              (click)="mobileSearchOpen.set(!mobileSearchOpen())">
        <span nz-icon nzType="search"></span>
      </button>

      <!-- Cart Icon -->
      <a routerLink="/cart" class="cart-icon-btn">
        <nz-badge [nzCount]="cartCount()" [nzOverflowCount]="99">
          <span nz-icon nzType="shopping-cart" class="cart-icon"></span>
        </nz-badge>
      </a>

      <!-- Login / Dashboard CTA -->
      @if (isAuthenticated()) {
        <a routerLink="/dashboard">
          <button nz-button nzType="primary" class="login-btn hide-mobile">
            <span nz-icon nzType="dashboard"></span>
            Dashboard
          </button>
        </a>
      } @else {
        <a routerLink="/login">
          <button nz-button nzType="primary" class="login-btn hide-mobile">
            <span nz-icon nzType="user"></span>
            {{ 'nav.login' | translate }}
          </button>
        </a>
      }

      <!-- Mobile hamburger -->
      <button class="hamburger hide-desktop" (click)="mobileOpen.set(true)">
        <span nz-icon nzType="menu" nzTheme="outline"></span>
      </button>
    </div>
  </div>

  <!-- Mobile search bar — expands under the header when the icon above is
       tapped, instead of forcing a trip through the full drawer. -->
  @if (mobileSearchOpen()) {
    <form class="mobile-search-bar hide-desktop" (ngSubmit)="search(mobileTopSearchBox.value)">
      <button type="submit" class="navbar-search__icon" aria-label="Search">
        <span nz-icon nzType="search"></span>
      </button>
      <input #mobileTopSearchBox type="text" class="mobile-search-bar__input"
             placeholder="Search products…" autofocus />
      <button type="button" class="mobile-search-bar__close" aria-label="Close search"
              (click)="mobileSearchOpen.set(false)">
        <span nz-icon nzType="close"></span>
      </button>
    </form>
  }
</header>

<!-- Mobile Drawer -->
<nz-drawer
  [nzVisible]="mobileOpen()"
  nzPlacement="right"
  nzTitle="NAJUS MSME"
  [nzWidth]="280"
  (nzOnClose)="mobileOpen.set(false)">
  <ng-container *nzDrawerContent>
    <form class="navbar-search navbar-search--mobile"
          (ngSubmit)="search(mobileSearchBox.value); mobileOpen.set(false)">
      <button type="submit" class="navbar-search__icon" aria-label="Search">
        <span nz-icon nzType="search"></span>
      </button>
      <input #mobileSearchBox type="text" class="navbar-search__input" placeholder="Search products…" />
    </form>

    <nav class="mobile-nav">
      @for (link of navLinks; track link.path) {
        <a class="mobile-nav__link"
           [routerLink]="link.path"
           routerLinkActive="mobile-nav__link--active"
           (click)="mobileOpen.set(false)">
          <span nz-icon [nzType]="link.icon"></span>
          {{ link.label | translate }}
        </a>
      }

      <div class="mobile-nav__divider"></div>

      @if (isAuthenticated()) {
        <a routerLink="/dashboard" (click)="mobileOpen.set(false)">
          <button nz-button nzType="primary" nzBlock style="margin-top:16px">
            <span nz-icon nzType="dashboard"></span>
            Dashboard
          </button>
        </a>
      } @else {
        <a routerLink="/login" (click)="mobileOpen.set(false)">
          <button nz-button nzType="primary" nzBlock style="margin-top:16px">
            {{ 'nav.login' | translate }}
          </button>
        </a>
      }
    </nav>
  </ng-container>
</nz-drawer>
